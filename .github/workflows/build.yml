name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MyAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyAI
          path: MyAI.apk

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: My AI (latest build)
          body: "Auto build #${{ github.run_number }} from ${{ github.sha }}"
          files: MyAI.apk
          make_latest: true
